<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emer Gallos | 60th Birthday Celebration</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="sparkles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
<div class="balloon balloon1"></div>
<div class="balloon balloon2"></div>
<div class="balloon balloon3"></div>

<section id="opening">

    <div class="opening-card">

        <h1>Emer Gallos</h1>

        <h2>60th Birthday Celebration</h2>

        <p>
            August 13, 2026<br>
            4:00 PM
        </p>

        <button onclick="openInvitation()">
            View Invitation
        </button>

    </div>

</section>


<section id="invitation" style="display:none;">


<div class="container">


<h1>60th Birthday Celebration</h1>


<img src="front.png" class="invite-card" onclick="openImage(this)">


<div class="details">

<p>
August 13, 2026<br>
4:00 PM
</p>


<p>
Gallos Residence<br>
Brgy. Tagororoc<br>
Nabas, Aklan
</p>


<button onclick="openMap()">
View Location
</button>


</div>


<div id="countdown"></div>


<img src="back.png" class="invite-card back" onclick="openImage(this)">


</div>


</section>
<div id="imageViewer">

    <button id="closeViewer" onclick="closeImage()">
        ×
    </button>

    <img id="fullImage">

</div>
<button id="topButton" onclick="goTop()">
    ↑
</button>
<div id="loader">

    <div class="loader-content">

    <div class="gold-loader"></div>

    <h1>Emer Gallos</h1>

    <p>60th Birthday Celebration</p>

    </div>

</div>
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">
    🔇
</button>
<script src="script.js"></script>

</body>
</html>
